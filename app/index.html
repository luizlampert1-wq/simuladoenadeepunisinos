<title>Simulado ENADE Produção</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap");

  :root{

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1520; --surface:#161e2b; --surface-2:#1d2736; --line:#2c3849;
      --ink:#e8edf5; --ink-2:#a9b6c8; --ink-3:#8494aa;
      --brand:#5aa2f5; --brand-ink:#b9d6fb; --brand-soft:#16283f;
      --ok:#4ec98a; --ok-soft:#12301f; --err:#f28b82; --err-soft:#33191a;
      --warn:#e3b341; --warn-soft:#2e2513;
      --disc:#c4a2f0; --disc-soft:#241a33;

    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1520; --surface:#161e2b; --surface-2:#1d2736; --line:#2c3849;
    --ink:#e8edf5; --ink-2:#a9b6c8; --ink-3:#8494aa;
    --brand:#5aa2f5; --brand-ink:#b9d6fb; --brand-soft:#16283f;

  *{box-sizing:border-box}

  /* ---------- top bar ---------- */

  /* ---------- genérico ---------- */

             letter-spacing:-.02em}
  .progress{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:8px}

  .grid-nav{display:grid; grid-template-columns:repeat(13,1fr); gap:5px; margin-top:12px}

  .gn{aspect-ratio:1; border:1px solid var(--line); background:var(--surface); border-radius:7px;

  .gn.done{background:var(--brand-soft); border-color:transparent; color:var(--brand-ink)}

  /* ---------- resultado ---------- */
  .score{display:flex; align-items:center; gap:20px; flex-wrap:wrap}

  Aplicativo de treinamento independente, elaborado a partir das provas públicas do ENADE (INEP).

<script>
/* ============================================================
   Banco de questões (injetado pelo build.py — ofuscado)
   ============================================================ */
const BANCO_ENC = "__BANCO__";
const BUILD_INFO = __BUILD__;

function decodeBanco(s){
  const bin = atob(s);
  const n = bin.length, arr = new Uint8Array(n);
  const key = "enade-ep-unisinos";
  for (let i = 0; i < n; i++) arr[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
  return JSON.parse(new TextDecoder("utf-8").decode(arr));
}
const BANCO = decodeBanco(BANCO_ENC);
const OBJETIVAS   = BANCO.filter(q => q.formato === "objetiva");
const DISCURSIVAS = BANCO.filter(q => q.formato === "discursiva");

/* ============================================================
   Configuração
   ============================================================ */
const N_OBJETIVAS   = 36;   // objetivas por simulado
const N_DISCURSIVAS = 2;    // discursivas por simulado
const N_QUESTOES    = N_OBJETIVAS + N_DISCURSIVAS;   // 38, como no ENADE 2023
const MAX_POR_AREA  = 4;    // teto de objetivas da mesma área
const HIST_EVITAR   = 2;    // simulados anteriores cujas questões são evitadas
const DOMINIO       = "@edu.unisinos.br";
const MAX_LINHAS    = 15;   // limite de linhas da resposta discursiva, como no ENADE

/* ------------------------------------------------------------
   COLETA DE RESULTADOS
   Ponto único de integração. Enquanto `ativa` for false, tudo
   fica apenas no navegador do aluno (localStorage).
   Para ativar, veja a seção 7 do README.
   ------------------------------------------------------------ */
const COLETA = __COLETA__;   // vem de coleta.json, injetado pelo build.py

const LS = { hist:"enade_ep_hist_v2", prog:"enade_ep_prog_v2", tema:"enade_ep_tema_v1",
             aluno:"enade_ep_aluno_v1", fila:"enade_ep_fila_v1" };
const MAX_FILA = 50;

const coletaLigada = () => !!(COLETA && COLETA.ativa && COLETA.url);

/* Sempre enfileira e depois tenta escoar. Se o aluno estiver sem internet,
   o registro fica guardado e é reenviado na próxima vez que abrir o app. */
function registrarResultado(registro){
  const hist = store(LS.hist) || [];
  hist.unshift(registro);
  store(LS.hist, hist.slice(0, 30));

  if (!coletaLigada()) return;
  const fila = store(LS.fila) || [];
  fila.push(registro);
  store(LS.fila, fila.slice(-MAX_FILA));
  escoarFila();
}

/* Devolve true quando o registro pode sair da fila.
   modo "cors"     — o destino autoriza a leitura da resposta (Power Automate):
                     dá para saber de verdade se entregou.
   modo "no-cors"  — o destino não devolve cabeçalhos CORS (Google Apps Script):
                     a resposta é opaca; só falha de rede é detectável. */
async function enviar(registro){
  if (COLETA.modo === "no-cors"){
    await fetch(COLETA.url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(registro)
    });
    return true;
  }
  const r = await fetch(COLETA.url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(registro)
  });
  if (r.ok) return true;
  // 4xx é erro permanente (assinatura, esquema): reenviar não resolve e só
  // faria a fila bater no servidor a cada abertura. 5xx é passageiro.
  return r.status >= 400 && r.status < 500;
}

async function escoarFila(){
  if (!coletaLigada()) return;
  const fila = store(LS.fila) || [];
  if (!fila.length) return;
  const pendentes = [];
  for (const r of fila){
    let entregue = false;
    try { entregue = await enviar(r); } catch(e){ entregue = false; }
    if (!entregue) pendentes.push(r);
  }
  store(LS.fila, pendentes.slice(-MAX_FILA));
}
const LETRAS = ["A","B","C","D","E"];
const $ = (sel, el=document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null");
  localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function del(k){ try{ localStorage.removeItem(k); }catch(e){} }

function shuffle(a){
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

function emailValido(e){
  return /^[^\s@]+@edu\.unisinos\.br$/i.test(String(e).trim());
}

/* ============================================================
   Sorteio: 36 objetivas equilibradas por área + 2 discursivas
   ============================================================ */
function sortearObjetivas(evitar){
  let pool = OBJETIVAS.filter(q => !evitar.has(q.id));
  if (pool.length < N_OBJETIVAS) pool = OBJETIVAS.slice();
  const escolhidas = [], porArea = {};
  for (let teto = MAX_POR_AREA; teto <= N_OBJETIVAS && escolhidas.length < N_OBJETIVAS; teto++){
    for (const q of shuffle(pool)){
      if (escolhidas.length >= N_OBJETIVAS) break;
      if (escolhidas.some(e => e.id === q.id)) continue;
      if ((porArea[q.area] || 0) >= teto) continue;
      escolhidas.push(q);
      porArea[q.area] = (porArea[q.area] || 0) + 1;
    }
  }
  return shuffle(escolhidas);
}

function sortearDiscursivas(evitar){
  let pool = DISCURSIVAS.filter(q => !evitar.has(q.id));
  if (pool.length < N_DISCURSIVAS) pool = DISCURSIVAS.slice();
  // evita as duas discursivas caírem na mesma área, quando possível
  const emb = shuffle(pool), escolhidas = [];
  for (const q of emb){
    if (escolhidas.length >= N_DISCURSIVAS) break;
    if (escolhidas.some(e => e.area === q.area)) continue;
    escolhidas.push(q);
  }
  for (const q of emb){
    if (escolhidas.length >= N_DISCURSIVAS) break;
    if (!escolhidas.some(e => e.id === q.id)) escolhidas.push(q);
  }
  return escolhidas;
}

function sortear(){
  const hist = store(LS.hist) || [];
  const evitar = new Set(hist.slice(0, HIST_EVITAR).flatMap(h => h.ids || []));
  return [...sortearObjetivas(evitar), ...sortearDiscursivas(evitar)];
}

/* ============================================================
   Estado
   ============================================================ */
let S = null;   // { nome, email, questoes, respostas, atual, inicio }

function salvarProgresso(){
  if (!S) return;
  store(LS.prog, { nome:S.nome, email:S.email, ids:S.questoes.map(q=>q.id),
                   respostas:S.respostas, atual:S.atual, inicio:S.inicio });
}
function restaurarProgresso(){
  const p = store(LS.prog);
  if (!p || !p.ids) return null;
  const qs = p.ids.map(id => BANCO.find(q => q.id === id)).filter(Boolean);
  if (qs.length !== p.ids.length) return null;
  return { nome:p.nome, email:p.email, questoes:qs, respostas:p.respostas||{},
           atual:p.atual||0, inicio:p.inicio };
}

/* ============================================================
   Telas
   ============================================================ */
const app = $("#app");

function telaInicial(msg){
  // NÃO apagar LS.prog aqui: é esta função que roda ao abrir a página, e o
  // simulado interrompido precisa sobreviver para ser oferecido de volta.
  // Quem apaga é o botão "Descartar" e o fim do simulado (telaResultado).
  const hist  = store(LS.hist) || [];
  const aluno = store(LS.aluno) || {};
  const nOf   = BANCO.filter(q=>q.tipo==="Oficial").length;
  const nArea = new Set(BANCO.map(q=>q.area)).size;
  const pend  = restaurarProgresso();

  app.innerHTML = `
    <div class="card">
      <h2>Treinamento ENADE — Engenharia de Produção UNISINOS</h2>
      <p class="muted" style="margin:10px 0 0">
        Cada simulado reproduz a estrutura da prova de 2023: <b>${N_QUESTOES} questões</b> —
        ${N_OBJETIVAS} objetivas e ${N_DISCURSIVAS} discursivas — sorteadas do banco e distribuídas
        entre as áreas da Engenharia de Produção. Ao final, as objetivas são corrigidas
        automaticamente e as discursivas recebem o padrão de resposta com critérios de correção.
      </p>
      <div class="stats">
        <div class="stat"><b>${BANCO.length}</b><span>questões no banco</span></div>
        <div class="stat"><b>${OBJETIVAS.length}</b><span>objetivas</span></div>
        <div class="stat"><b>${DISCURSIVAS.length}</b><span>discursivas</span></div>
        <div class="stat"><b>${nOf}</b><span>oficiais do ENADE</span></div>
        <div class="stat"><b>${nArea}</b><span>áreas cobertas</span></div>
      </div>
      <p class="small muted" style="margin-top:14px">
        Questões oficiais extraídas das provas do ENADE de 2014, 2017, 2019 e 2023 (componente
        específico), com os gabaritos definitivos do INEP. As questões adaptadas e inéditas seguem
        o mesmo padrão de exigência, mas <b>não são questões oficiais do exame</b>.
      </p>
    </div>

    ${msg ? `<div class="card" style="border-color:var(--ok)"><b>${esc(msg)}</b></div>` : ""}

    ${pend ? `
    <div class="card" style="border-color:var(--warn)">
      <h3 style="font-size:1rem">Simulado em andamento</h3>
      <p class="muted small" style="margin:8px 0 14px">
        Há um simulado não finalizado de <b>${esc(pend.nome)}</b>
        (${Object.keys(pend.respostas).length} de ${pend.questoes.length} respondidas).
      </p>
      <div class="row">
        <button class="btn" id="retomar">Retomar simulado</button>
        <button class="btn ghost" id="descartar">Descartar e começar novo</button>
      </div>
    </div>` : ""}

    <div class="card">
      <h3 style="font-size:1rem; margin-bottom:14px">Identificação</h3>
      ${coletaLigada() ? `
      <div class="note" style="margin:0 0 18px">
        <b>Como seus dados são usados</b>
        Ao finalizar um simulado, são enviados ao professor responsável pela disciplina:
        seu nome, seu e-mail institucional, a data, o tempo gasto, o número de acertos e erros
        e o seu desempenho por área. A finalidade é acompanhar a preparação da turma para o ENADE.
        <b style="margin-top:8px">O que não é enviado</b>
        O texto que você escreve nas questões discursivas permanece apenas neste navegador —
        só o número de discursivas respondidas é informado.
      </div>` : ""}
      <div style="margin-bottom:14px">
        <label for="email">E-mail institucional</label>
        <input type="email" id="email" placeholder="seunome@edu.unisinos.br"
               autocomplete="email" inputmode="email" maxlength="120"
               value="${esc(aluno.email || "")}">
        <p class="hint">O acesso é restrito a e-mails <b>${DOMINIO}</b>.</p>
      </div>
      <div>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Digite seu nome completo" autocomplete="name"
               maxlength="80" value="${esc(aluno.nome || "")}">
      </div>
      <p id="erroForm" class="erro" style="display:none"></p>
      <div class="row" style="margin-top:16px">
        <button class="btn" id="iniciar">Iniciar simulado</button>
      </div>
    </div>

    ${hist.length ? `
    <div class="card">
      <div class="spread"><h3 style="font-size:1rem">Seus simulados anteriores</h3>
        <button class="btn ghost small" id="limparHist">Limpar histórico</button></div>
      <table class="areas" style="margin-top:12px">
        ${hist.slice(0,10).map(h=>`<tr>
          <td>${esc(h.nome)}<br><span class="small muted">${esc(h.data)}</span></td>
          <td><b>${h.acertos}/${h.totalObjetivas ?? h.total}</b> &nbsp;
              ${Math.round(h.acertos/(h.totalObjetivas ?? h.total)*100)}%</td>
        </tr>`).join("")}
      </table>
    </div>` : ""}
  `;

  const iniciar = () => {
    const email = $("#email").value.trim();
    const nome  = $("#nome").value.trim();
    const err   = $("#erroForm");
    if (!emailValido(email)){
      err.textContent = `Informe um e-mail institucional válido, terminado em ${DOMINIO}.`;
      err.style.display = "block"; $("#email").focus(); return;
    }
    if (!nome){
      err.textContent = "Informe seu nome completo.";
      err.style.display = "block"; $("#nome").focus(); return;
    }
    store(LS.aluno, { nome, email });
    S = { nome, email, questoes:sortear(), respostas:{}, atual:0, inicio:Date.now() };
    salvarProgresso(); telaQuiz();
  };
  $("#iniciar").onclick = iniciar;
  ["email","nome"].forEach(id =>
    $("#"+id).addEventListener("keydown", e => { if (e.key === "Enter") iniciar(); }));
  if (pend){
    $("#retomar").onclick   = () => { S = pend; telaQuiz(); };
    $("#descartar").onclick = () => { del(LS.prog); telaInicial(); };
  }
  if (hist.length) $("#limparHist").onclick = () => { del(LS.hist); telaInicial(); };
  window.scrollTo(0,0);
}

function telaQuiz(){
  const q = S.questoes[S.atual], n = S.questoes.length;
  const respondidas = Object.keys(S.respostas).filter(k => String(S.respostas[k]).trim()).length;
  const resp = S.respostas[q.id];
  const disc = q.formato === "discursiva";

  app.innerHTML = `
    <div class="quizbar"><div class="wrap">
      <div class="spread">
        <div><b>Questão ${S.atual+1} de ${n}</b>
          <span class="muted small"> · ${respondidas} respondida${respondidas===1?"":"s"}</span></div>
        <button class="btn danger" id="finalizar">Finalizar simulado</button>
      </div>
      <div class="progress"><i style="width:${(respondidas/n)*100}%"></i></div>
    </div></div>

    <div class="card">
      <div class="tags">
        <span class="tag brand">${esc(q.area)}</span>
        <span class="tag">${esc(q.dificuldade)}</span>
        ${disc ? `<span class="tag disc">Discursiva${q.valor ? " · " + esc(q.valor) : ""}</span>` : ""}
        ${q.tipo==="Oficial" ? `<span class="tag ok">Oficial ENADE ${q.ano}</span>`
                             : `<span class="tag warn">${esc(q.tipo)}</span>`}
      </div>
      <p class="enun">${esc(q.enunciado)}</p>
      ${q.figuraData ? `<div class="figbox"><img src="${q.figuraData}" alt="Figura da questão"
          loading="lazy"><div class="figcap">Toque na imagem para ampliar</div></div>` : ""}

      ${disc ? `
        <label for="disc">Sua resposta</label>
        <textarea id="disc" placeholder="Escreva aqui sua resposta..."
                  spellcheck="true">${esc(resp || "")}</textarea>
        <p class="hint" id="contador"></p>
      ` : `
        <div class="alts">
          ${LETRAS.map(L=>`
            <button class="alt ${resp===L?"sel":""}" data-k="${L}">
              <span class="k">${L}</span><span>${esc(q.alternativas[L])}</span>
            </button>`).join("")}
        </div>
        ${resp ? `<div class="row" style="margin-top:12px">
          <button class="btn ghost small" id="limpar">Limpar resposta</button></div>` : ""}
      `}
    </div>

    <div class="card plain">
      <div class="row">
        <button class="btn ghost" id="ant" ${S.atual===0?"disabled":""}>← Anterior</button>
        <button class="btn ghost" id="prox" ${S.atual===n-1?"disabled":""}>Próxima →</button>
      </div>
      <p class="small muted" style="margin:14px 0 0">
        Navegue para qualquer questão. As duas últimas, com borda destacada, são discursivas.
        <b>Pode fechar e voltar depois</b> — cada resposta é salva na hora, neste navegador.</p>
      <div class="grid-nav">
        ${S.questoes.map((qq,i)=>`<button class="gn
          ${String(S.respostas[qq.id]||"").trim()?"done":""}
          ${qq.formato==="discursiva"?"disc":""}
          ${i===S.atual?"cur":""}" data-i="${i}">${i+1}</button>`).join("")}
      </div>
    </div>
  `;

  if (disc){
    const ta = $("#disc"), cont = $("#contador");
    const atualiza = () => {
      const txt = ta.value;
      const linhas = txt ? txt.split(/\r?\n/).length : 0;
      cont.textContent = `${txt.trim().length} caracteres · ${linhas} linha${linhas===1?"":"s"}`
        + ` — o ENADE limita a resposta a ${MAX_LINHAS} linhas.`;
      cont.style.color = linhas > MAX_LINHAS ? "var(--err)" : "";
    };
    ta.addEventListener("input", () => {
      S.respostas[q.id] = ta.value; salvarProgresso(); atualiza();
    });
    atualiza();
  } else {
    app.querySelectorAll(".alt").forEach(b => b.onclick = () => {
      S.respostas[q.id] = b.dataset.k; salvarProgresso();
      if (S.atual < n-1){ S.atual++; telaQuiz(); } else telaQuiz();
    });
    if (resp) $("#limpar").onclick = () => {
      delete S.respostas[q.id]; salvarProgresso(); telaQuiz(); };
  }

  $("#ant").onclick  = () => { if (S.atual>0){ S.atual--; salvarProgresso(); telaQuiz(); } };
  $("#prox").onclick = () => { if (S.atual<n-1){ S.atual++; salvarProgresso(); telaQuiz(); } };
  app.querySelectorAll(".gn").forEach(b => b.onclick = () => {
    S.atual = +b.dataset.i; salvarProgresso(); telaQuiz(); });
  $("#finalizar").onclick = confirmarFinal;
  app.querySelectorAll(".figbox img").forEach(img => img.onclick = () => lightbox(img.src));
  window.scrollTo(0,0);
}

function confirmarFinal(){
  const respondidas = S.questoes.filter(q => String(S.respostas[q.id]||"").trim()).length;
  const faltam = S.questoes.length - respondidas;
  const div = document.createElement("div");
  div.className = "modal";
  div.innerHTML = `<div class="box">
    <h3 style="font-size:1.05rem">Tem certeza de que deseja finalizar?</h3>
    <p class="muted" style="margin:12px 0 0">Após isso, suas respostas serão corrigidas e o
      gabarito será exibido.</p>
    ${faltam ? `<p style="color:var(--warn); margin:12px 0 0"><b>Atenção:</b> ${faltam}
      ${faltam===1?"questão ainda não foi respondida."
                 :"questões ainda não foram respondidas."}
      As objetivas em branco contam como erro.</p>` : ""}
    <div class="row" style="margin-top:20px; justify-content:flex-end">
      <button class="btn ghost" id="nao">Continuar respondendo</button>
      <button class="btn danger" id="sim">Finalizar e corrigir</button>
    </div></div>`;
  document.body.appendChild(div);
  $("#nao", div).onclick = () => div.remove();
  $("#sim", div).onclick = () => { div.remove(); telaResultado(); };
  div.onclick = e => { if (e.target === div) div.remove(); };
}

function telaResultado(){
  const objetivas   = S.questoes.filter(q => q.formato === "objetiva");
  const discursivas = S.questoes.filter(q => q.formato === "discursiva");

  let acertos = 0, naoResp = 0;
  const detalhe = S.questoes.map((q,i) => {
    const r = S.respostas[q.id];
    if (q.formato === "objetiva"){
      const ok = r === q.gabarito;
      if (ok) acertos++;
      if (!r) naoResp++;
      return { i, q, r:r||null, ok };
    }
    const txt = String(r||"").trim();
    if (!txt) naoResp++;
    return { i, q, r:txt, ok:null };
  });

  const nObj  = objetivas.length;
  const erros = nObj - acertos;
  const pct   = Math.round(acertos / nObj * 100);
  const mins  = Math.max(1, Math.round((Date.now() - S.inicio) / 60000));

  const areas = {};
  for (const d of detalhe){
    if (d.q.formato !== "objetiva") continue;
    const a = areas[d.q.area] || (areas[d.q.area] = { c:0, t:0 });
    a.t++; if (d.ok) a.c++;
  }

  registrarResultado({
    nome: S.nome, email: S.email,
    data: new Date().toLocaleString("pt-BR"),
    dataISO: new Date().toISOString(),
    acertos, erros, totalObjetivas: nObj, percentual: pct,
    discursivasRespondidas: discursivas.filter(q => String(S.respostas[q.id]||"").trim()).length,
    totalDiscursivas: discursivas.length,
    minutos: mins,
    ids: S.questoes.map(q => q.id),
    porArea: Object.fromEntries(Object.entries(areas).map(([a,v]) => [a, `${v.c}/${v.t}`]))
  });
  del(LS.prog);

  const msg = pct >= 80 ? "Excelente desempenho!" : pct >= 60 ? "Bom desempenho — siga revisando."
            : pct >= 40 ? "Desempenho intermediário: revise as áreas com mais erros."
                        : "Vale retomar os fundamentos das áreas abaixo.";

  app.innerHTML = `
    <div class="card">
      <h2 style="font-size:1.15rem">Resultado de ${esc(S.nome)}</h2>
      <p class="small muted" style="margin:4px 0 18px">
        ${esc(S.email)} · ${new Date().toLocaleString("pt-BR")} · tempo aproximado: ${mins} min</p>
      <div class="score">
        <div class="donut" style="--p:${pct}"><div>${pct}%</div></div>
        <div class="stats" style="flex:1; min-width:240px; margin:0">
          <div class="stat"><b style="color:var(--ok)">${acertos}</b><span>acertos</span></div>
          <div class="stat"><b style="color:var(--err)">${erros}</b><span>erros</span></div>
          <div class="stat"><b>${(acertos/nObj*10).toFixed(1)}</b><span>nota objetiva</span></div>
          <div class="stat"><b>${discursivas.length}</b><span>discursivas</span></div>
        </div>
      </div>
      <p style="margin:18px 0 0"><b>${msg}</b></p>
      <p class="small muted" style="margin:10px 0 0">
        O percentual considera apenas as ${nObj} questões objetivas. As discursivas não têm correção
        automática — abaixo você encontra o padrão de resposta e os critérios para autoavaliação.
      </p>
    </div>

    <div class="card">
      <h3 style="font-size:1rem">Desempenho por área (objetivas)</h3>
      <table class="areas">
        ${Object.entries(areas).sort((a,b)=> a[1].c/a[1].t - b[1].c/b[1].t)
          .map(([a,v])=>`<tr><td>${esc(a)}</td>
          <td>${v.c}/${v.t} &nbsp;<b style="color:${v.c===v.t?"var(--ok)":v.c===0?"var(--err)":"inherit"}">
          ${Math.round(v.c/v.t*100)}%</b></td></tr>`).join("")}
      </table>
    </div>

    <div class="card">
      <h3 style="font-size:1rem">Correção detalhada</h3>
      <p class="small muted" style="margin:6px 0 4px">Toque em cada questão para ver a justificativa.</p>
      ${detalhe.map(d => d.q.formato === "objetiva" ? revisaoObjetiva(d) : revisaoDiscursiva(d)).join("")}
    </div>

    <div class="card plain" style="text-align:center">
      <div class="row" style="justify-content:center">
        <button class="btn" id="novo">Fazer novo simulado</button>
        <button class="btn ghost" id="inicio">Voltar ao início</button>
      </div>
    </div>
  `;

  $("#novo").onclick = () => {
    S = { nome:S.nome, email:S.email, questoes:sortear(), respostas:{}, atual:0, inicio:Date.now() };
    salvarProgresso(); telaQuiz();
  };
  $("#inicio").onclick = () => telaInicial();
  app.querySelectorAll(".figbox img").forEach(img => img.onclick = () => lightbox(img.src));
  ligarAutoavaliacao();
  window.scrollTo(0,0);
}

function cabecalhoRev(q){
  return `<div class="tags">
    ${q.tipo==="Oficial" ? `<span class="tag ok">${esc(q.referencia||("Oficial ENADE "+q.ano))}</span>`
                         : `<span class="tag warn">${esc(q.tipo)}${q.referencia?" · "+esc(q.referencia):""}</span>`}
    <span class="tag">${esc(q.dificuldade)}</span>
  </div>`;
}

function revisaoObjetiva({ i, q, r, ok }){
  return `
  <details class="rev ${ok?"ok":"bad"}">
    <summary>
      <span class="ico">${ok?"✓":"✕"}</span>
      <span style="flex:1">Questão ${i+1} — ${esc(q.area)}</span>
      <span class="small muted resp">${r ? `Sua resposta: ${r}` : "Em branco"} · Gabarito: ${q.gabarito}</span>
    </summary>
    <div class="body">
      ${cabecalhoRev(q)}
      <p class="enun">${esc(q.enunciado)}</p>
      ${q.figuraData ? `<div class="figbox"><img src="${q.figuraData}" alt="Figura da questão"
          loading="lazy"><div class="figcap">Toque na imagem para ampliar</div></div>` : ""}
      <div class="alts">
        ${LETRAS.map(L=>{
          const cls = L===q.gabarito ? "right" : (L===r ? "wrong" : "");
          return `<div class="alt ${cls}"><span class="k">${L}</span><span>${esc(q.alternativas[L])}</span></div>`;
        }).join("")}
      </div>
      <div class="note ${ok?"ok":"bad"}">
        <b>${ok ? "Você acertou" : (r ? `Sua resposta: ${r} — incorreta` : "Questão não respondida")}</b>
        Resposta correta: ${q.gabarito}
      </div>
      ${(!ok && r && q.porqueErradas[r]) ? `<div class="note bad">
        <b>Por que a alternativa ${r} está incorreta</b>${esc(q.porqueErradas[r])}</div>` : ""}
      <div class="note ok"><b>Justificativa da resposta correta</b>${esc(q.justificativa)}</div>
      ${q.observacao ? `<div class="note warn"><b>Observação</b>${esc(q.observacao)}</div>` : ""}
      <details style="margin-top:10px">
        <summary class="small muted" style="cursor:pointer">Ver por que as demais alternativas estão incorretas</summary>
        <div style="margin-top:8px">
          ${LETRAS.filter(L => L!==q.gabarito && q.porqueErradas[L]).map(L =>
            `<p class="small" style="margin:6px 0"><b>${L})</b> ${esc(q.porqueErradas[L])}</p>`).join("")}
        </div>
      </details>
      <p class="small muted" style="margin:12px 0 0"><b>Competência avaliada:</b> ${esc(q.competencia)}</p>
    </div>
  </details>`;
}

function revisaoDiscursiva({ i, q, r }){
  const respondeu = !!r;
  return `
  <details class="rev disc">
    <summary>
      <span class="ico">✎</span>
      <span style="flex:1">Questão ${i+1} — ${esc(q.area)} (discursiva)</span>
      <span class="small muted resp">${respondeu ? "Respondida" : "Em branco"} · autoavaliação</span>
    </summary>
    <div class="body">
      ${cabecalhoRev(q)}
      <p class="enun">${esc(q.enunciado)}</p>
      ${q.figuraData ? `<div class="figbox"><img src="${q.figuraData}" alt="Figura da questão"
          loading="lazy"><div class="figcap">Toque na imagem para ampliar</div></div>` : ""}

      <div class="note ${respondeu ? "" : "warn"}">
        <b>Sua resposta</b>${respondeu ? esc(r) : "Você não respondeu esta questão."}</div>

      <div class="note disc"><b>Padrão de resposta</b>${esc(q.padraoResposta)}</div>

      <div class="note disc">
        <b>Critérios de correção — marque os que você atendeu</b>
        <ul class="criterios" data-qid="${esc(q.id)}">
          ${q.criterios.map((c,k)=>`<li>
            <input type="checkbox" id="c_${esc(q.id)}_${k}" class="crit">
            <label for="c_${esc(q.id)}_${k}" style="font-weight:400; margin:0">${esc(c)}</label>
          </li>`).join("")}
        </ul>
        <div class="autoscore" data-for="${esc(q.id)}">Marque os critérios atendidos para estimar sua nota.</div>
      </div>

      <p class="small muted" style="margin:12px 0 0"><b>Competência avaliada:</b> ${esc(q.competencia)}</p>
      <p class="small muted" style="margin:8px 0 0">
        O INEP não divulga o padrão de resposta das questões discursivas junto com o gabarito.
        O padrão acima foi elaborado para este aplicativo com base no enunciado e na bibliografia
        da área — serve como referência de estudo, não como gabarito oficial.
      </p>
    </div>
  </details>`;
}

function ligarAutoavaliacao(){
  app.querySelectorAll(".criterios").forEach(ul => {
    const qid = ul.dataset.qid;
    const caixas = [...ul.querySelectorAll(".crit")];
    const alvo = app.querySelector(`.autoscore[data-for="${CSS.escape(qid)}"]`);
    const atualiza = () => {
      const m = caixas.filter(c => c.checked).length;
      if (!m){ alvo.textContent = "Marque os critérios atendidos para estimar sua nota."; return; }
      const nota = (m / caixas.length * 10).toFixed(1);
      alvo.textContent = `${m} de ${caixas.length} critérios atendidos — nota estimada ${nota} de 10,0`;
    };
    caixas.forEach(c => c.addEventListener("change", atualiza));
  });
}

function lightbox(src){
  const d = document.createElement("div");
  d.className = "lightbox";
  d.innerHTML = `<img src="${src}" alt="Figura ampliada">`;
  d.onclick = () => d.remove();
  document.body.appendChild(d);
}

/* ============================================================
   Tema + início
   ============================================================ */
(function initTema(){
  const t = store(LS.tema);
  if (t) document.documentElement.setAttribute("data-theme", t);
  $("#themeBtn").onclick = () => {
    const atual = document.documentElement.getAttribute("data-theme");
    const escuro = atual ? atual === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const novo = escuro ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", novo);
    store(LS.tema, novo);
  };
})();

$("#sub").textContent =
  `${N_QUESTOES} questões por simulado · banco com ${BANCO.length} · atualizado em ${BUILD_INFO.data}`;
escoarFila();   // reenvia o que ficou pendente de uma sessão sem internet
telaInicial();
</script>
